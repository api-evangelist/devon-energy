name: Devon Energy
aid: devon-energy
description: >-
  Devon Energy Corporation (NYSE: DVN) is an independent oil and natural gas exploration and
  production company operating across U.S. onshore basins, anchored by a leading position in the
  economic core of the Delaware Basin. On May 7, 2026 Devon completed an all-stock merger with
  Coterra Energy, creating a large-cap shale operator with an estimated combined enterprise value
  of about $58 billion; the combined company retains the Devon Energy name and the DVN ticker, is
  headquartered in Houston and keeps a significant presence in Oklahoma City. Devon publishes a
  corporate website, an investor-relations site, sustainability and cybersecurity reporting, and a
  supplier and interest-owner information section, but operates no public developer program, no
  API and no machine-readable API artifacts. Owner statements are delivered through EnergyLink and
  supplier invoicing through Enverus OpenInvoice — both third-party platforms, neither a Devon API.
